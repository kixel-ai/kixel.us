<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Kixel, Corp.</title>
		<meta name="description" content="Kixel, Corp. — making live media suck less. Behind kixel.ai, moq.dev, and moq.pro." />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />

		<meta property="og:title" content="Kixel, Corp." />
		<meta property="og:description" content="Making live media suck less." />
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://kixel.us" />

		<style>
			:root {
				color-scheme: dark;
				--bg: #0f172a;
				--ink: #e7ecf3;
				--muted: #8b98ad;
				--faint: #64748b;
				--green: #4cc315;
			}

			* {
				box-sizing: border-box;
			}

			html,
			body {
				margin: 0;
				min-height: 100%;
				background: var(--bg);
				color: var(--ink);
				font: 18px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
				-webkit-font-smoothing: antialiased;
				text-rendering: optimizeLegibility;
			}

			main {
				min-height: 100svh;
				display: grid;
				grid-template-columns: auto auto;
				align-items: center;
				justify-content: center;
				gap: clamp(1.5rem, 5vw, 4.5rem);
				padding: 2rem 1.5rem;
			}

			#cat {
				width: min(76svh, 48vw, 440px);
				height: auto;
				display: block;
				overflow: visible;
			}

			#cat .eye {
				transform-box: fill-box;
				transform-origin: center;
				transition: transform 70ms ease-in-out;
			}

			#cat.blink .eye {
				transform: scaleY(0.12);
			}

			h1 {
				font-size: 1.25rem;
				font-weight: 650;
				letter-spacing: -0.01em;
				color: #f8fafc;
				margin: 0 0 0.2rem;
			}

			.tagline {
				font-size: 0.95rem;
				color: var(--muted);
				margin: 0 0 1.75rem;
			}

			nav {
				display: grid;
				grid-template-columns: repeat(2, auto);
				gap: 1.75rem 3.25rem;
			}

			h2 {
				color: var(--green);
				font-size: 0.78rem;
				font-weight: 650;
				letter-spacing: 0.08em;
				text-transform: uppercase;
				margin: 0 0 0.45rem;
			}

			ul {
				list-style: none;
				margin: 0;
				padding: 0;
			}

			li {
				margin: 0.1rem 0;
			}

			a {
				color: var(--ink);
				text-decoration: none;
				display: inline-flex;
				align-items: baseline;
				gap: 0.5rem;
				transition: color 0.14s ease;
			}

			a:hover,
			a:focus-visible {
				color: var(--green);
				outline: none;
			}

			.hint {
				font-size: 0.8rem;
				color: var(--faint);
				transition: color 0.14s ease;
			}

			a:hover .hint,
			a:focus-visible .hint {
				color: var(--muted);
			}

			@media (max-width: 720px) {
				main {
					grid-template-columns: auto;
					justify-items: center;
					align-content: center;
					gap: 1.75rem;
					padding: 2rem 1.5rem 3rem;
				}

				#cat {
					width: min(72vw, 44svh, 280px);
				}
			}

			@media (max-width: 380px) {
				nav {
					grid-template-columns: auto;
					gap: 1.5rem;
				}
			}
		</style>
	</head>
	<body>
		<main>
			<svg id="cat" viewBox="0 0 420 420" role="img" aria-label="Hand-drawn white cat with green eyes">
				<g id="face">
					<g transform="translate(0,420) scale(0.1,-0.1)" fill="#fafafa">
						<path d="M1051 3668 c-57 -38 -76 -94 -141 -404 -33 -159 -79 -372 -101 -474 -22 -102 -69 -322 -104 -490 -109 -521 -163 -769 -200 -930 -64 -277 -96 -443 -102 -532 l-6 -87 31 -31 c25 -24 37 -30 54 -25 57 17 111 103 163 258 87 260 535 2103 535 2200 0 47 25 10 90 -136 165 -368 249 -517 338 -598 98 -89 99 -90 471 -60 130 10 266 18 302 18 111 -1 141 20 267 188 116 154 182 261 264 425 63 126 57 114 63 108 3 -3 23 -120 45 -259 56 -366 85 -537 170 -989 16 -91 46 -259 66 -375 58 -349 87 -447 208 -705 l81 -174 6 54 c4 30 17 118 30 195 18 109 22 178 22 310 -1 211 -12 288 -148 1010 -19 99 -55 299 -80 445 -82 469 -122 639 -192 815 -46 115 -76 159 -121 181 -45 21 -79 11 -107 -33 -11 -18 -32 -37 -47 -44 -42 -17 -103 -90 -141 -166 -74 -146 -230 -503 -264 -603 -20 -58 -39 -108 -42 -112 -4 -4 -35 -3 -70 3 -94 17 -284 -2 -456 -45 -76 -20 -140 -34 -140 -33 -23 36 -163 316 -239 477 -116 247 -204 415 -251 481 -18 25 -35 55 -39 65 -3 11 -22 35 -41 54 -47 45 -123 54 -174 18z" />
					</g>
					<g id="eyes">
						<g transform="translate(0,420) scale(0.1,-0.1)" fill="#4cc315">
							<path class="eye" d="M2306 2070 c-39 -12 -73 -46 -101 -101 -50 -98 -41 -173 29 -243 53 -53 95 -63 170 -42 145 43 191 228 83 334 -56 54 -116 71 -181 52z" />
							<path class="eye" d="M1715 2035 c-92 -33 -147 -134 -124 -229 32 -137 195 -182 295 -82 66 66 71 165 13 245 -51 71 -112 93 -184 66z" />
						</g>
					</g>
				</g>
			</svg>

			<div>
				<h1>Kixel, Corp.</h1>
				<p class="tagline">Making live media suck less.</p>
				<nav>
					<section>
						<h2>Products</h2>
						<ul>
							<li><a href="https://kixel.ai">kixel.ai <span class="hint">live mesh</span></a></li>
							<li><a href="https://moq.dev">moq.dev <span class="hint">open source</span></a></li>
							<li><a href="https://moq.pro">moq.pro <span class="hint">CDN</span></a></li>
						</ul>
					</section>
					<section>
						<h2>People</h2>
						<ul>
							<li><a href="https://kixel.me">Luke Curley</a></li>
							<li><a href="https://dawsin.dev">Dawsin Blanchard</a></li>
						</ul>
					</section>
					<section>
						<h2>Community</h2>
						<ul>
							<li><a href="https://discord.moq.dev">Discord</a></li>
							<li><a href="https://github.com/moq-dev">GitHub</a></li>
						</ul>
					</section>
					<section>
						<h2>Contact</h2>
						<ul>
							<li><a href="mailto:me@kixel.us">me@kixel.us</a></li>
						</ul>
					</section>
				</nav>
			</div>
		</main>

		<script>
			// The cat leans toward the cursor and its eyes follow, more than the face, for a little depth.
			const cat = document.getElementById("cat");
			const face = document.getElementById("face");
			const eyes = document.getElementById("eyes");

			if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
				const target = { x: 0, y: 0 };
				const now = { x: 0, y: 0 };
				let frame = 0;

				const draw = () => {
					now.x += (target.x - now.x) * 0.12;
					now.y += (target.y - now.y) * 0.12;
					face.style.transform = `translate(${now.x * 5}px, ${now.y * 3.5}px)`;
					eyes.style.transform = `translate(${now.x * 11}px, ${now.y * 9}px)`;
					cat.style.transform = `perspective(600px) rotateY(${now.x * 6}deg) rotateX(${-now.y * 6}deg)`;
					const settled = Math.abs(target.x - now.x) + Math.abs(target.y - now.y) < 0.001;
					frame = settled ? 0 : requestAnimationFrame(draw);
				};
				const aim = (x, y) => {
					target.x = x;
					target.y = y;
					if (!frame) frame = requestAnimationFrame(draw);
				};

				addEventListener("pointermove", (e) => {
					// Normalize to the cat's center, saturating about a cat-width away.
					const r = cat.getBoundingClientRect();
					const clamp = (v) => Math.max(-1, Math.min(1, v));
					aim(
						clamp((e.clientX - r.left - r.width / 2) / r.width),
						clamp((e.clientY - r.top - r.height / 2) / r.height),
					);
				});
				document.documentElement.addEventListener("pointerleave", () => aim(0, 0));

				const blink = () => {
					cat.classList.add("blink");
					setTimeout(() => cat.classList.remove("blink"), 140);
					setTimeout(blink, 2500 + Math.random() * 5000);
				};
				setTimeout(blink, 2500);
			}
		</script>
	</body>
</html>
