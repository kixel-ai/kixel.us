<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Kixel, Corp.</title>
		<meta name="description" content="A tiny company making live media suck less. We build Media over QUIC: moq.dev (open source) and moq.pro (the CDN)." />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />

		<meta property="og:title" content="Kixel, Corp." />
		<meta property="og:description" content="A tiny company making live media suck less." />
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://kixel.us" />

		<style>
			:root {
				color-scheme: dark;
				--bg: #0e172a;
				--bg-soft: #131f38;
				--ink: #e7ecf3;
				--muted: #8b98ad;
				--faint: #56637a;
				--green: #00bf2d;
				--green-soft: #4cc315;
				--pink: #c31551;
				--rule: #22314f;
				--radius: 14px;
			}

			* { box-sizing: border-box; }

			html, body {
				margin: 0;
				background: var(--bg);
				color: var(--ink);
			}

			body {
				/* faint dotted "graph paper" — the markdown-file-in-an-editor vibe */
				background-image: radial-gradient(circle at 1px 1px, rgba(255, 255, 255, 0.035) 1px, transparent 0);
				background-size: 24px 24px;
				font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
				font-size: 17px;
				line-height: 1.7;
				-webkit-font-smoothing: antialiased;
				text-rendering: optimizeLegibility;
			}

			.page {
				max-width: 46rem;
				margin: 0 auto;
				padding: clamp(2.5rem, 6vw, 5.5rem) 1.4rem 4rem;
			}

			/* ---- the markdown "chrome": a muted # before every heading ---- */
			h1, h2 { position: relative; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; }
			h1 { font-size: clamp(2.5rem, 8vw, 3.6rem); margin: 0 0 0.2em; }
			h2 { font-size: clamp(1.35rem, 4vw, 1.7rem); margin: 2.8em 0 0.6em; }

			h1::before, h2::before {
				position: absolute;
				color: var(--green);
				font-family: ui-monospace, "SF Mono", Menlo, monospace;
				font-weight: 500;
				opacity: 0.55;
				right: 100%;
				padding-right: 0.4em;
				white-space: nowrap;
			}
			h1::before { content: "#"; font-size: 0.55em; top: 0.5em; }
			h2::before { content: "##"; font-size: 0.72em; top: 0.32em; }

			/* on narrow screens the # markers would clip off-canvas — inline them */
			@media (max-width: 600px) {
				h1::before, h2::before { position: static; padding: 0; display: block; opacity: 0.5; }

				/* stack the two logo links vertically on narrow screens */
				.links { flex-direction: column; gap: 1.75rem; }
			}

			p { margin: 0 0 1.1em; color: var(--ink); }
			.lede { font-size: 1.15rem; color: var(--muted); }
			.tagline {
				margin: 0.2em 0 0;
				font-size: 0.95rem;
				color: var(--muted);
			}

			strong { color: #fff; font-weight: 650; }

			a {
				color: var(--green-soft);
				text-decoration: none;
				border-bottom: 1px solid color-mix(in srgb, var(--green-soft) 35%, transparent);
				transition: color 0.15s, border-color 0.15s;
			}
			a:hover { color: #fff; border-bottom-color: #fff; }

			/* blockquote → the hot take */
			blockquote {
				margin: 1.6em 0;
				padding: 0.2em 0 0.2em 1.1em;
				border-left: 3px solid var(--green);
				color: var(--muted);
				font-style: italic;
			}
			blockquote strong { font-style: normal; }

			code {
				font-family: ui-monospace, "SF Mono", Menlo, monospace;
				font-size: 0.86em;
				background: var(--bg-soft);
				border: 1px solid var(--rule);
				padding: 0.12em 0.4em;
				border-radius: 5px;
				color: #d6e0f0;
			}

			/* profile avatar — the hand-drawn mark from the moq.dev blog */
			.avatar {
				display: block;
				width: 64px;
				height: 64px;
				padding: 7px;
				margin: 0 0 1rem;
				border-radius: 50%;
				background: var(--bg-soft);
				border: 1px solid var(--rule);
			}

			/* the two products, just inline logo links — no boxes */
			.links {
				list-style: none;
				padding: 0;
				margin: 2em 0 0;
				display: flex;
				flex-wrap: wrap;
				align-items: flex-start;
				gap: 2.75rem;
			}
			.links a {
				display: inline-flex;
				flex-direction: column;
				align-items: flex-start;
				gap: 0.55rem;
				border-bottom: 0;
				text-decoration: none;
				opacity: 0.92;
				transition: opacity 0.18s ease, transform 0.18s ease;
			}
			.links a:hover { opacity: 1; transform: translateY(-3px); }
			.links img { height: 40px; width: auto; }
			.links .tag {
				font-family: ui-monospace, Menlo, monospace;
				font-size: 0.72rem;
				letter-spacing: 0.05em;
				text-transform: uppercase;
				color: var(--green);
			}

			/* blinking terminal cursor after the title */
			.cursor {
				display: inline-block;
				width: 0.55ch;
				height: 0.9em;
				margin-left: 0.12em;
				translate: 0 0.08em;
				background: var(--green);
				animation: blink 1.1s step-end infinite;
			}
			@keyframes blink { 50% { opacity: 0; } }

			/* contact rows: a monospace "key: value" table, like frontmatter */
			.contact {
				list-style: none;
				padding: 0;
				margin: 1.4em 0 0;
				display: grid;
				gap: 0.55rem;
			}
			.contact li { display: flex; align-items: baseline; gap: 0.9rem; }
			.contact .key {
				flex: 0 0 5.2rem;
				font-family: ui-monospace, Menlo, monospace;
				font-size: 0.8rem;
				letter-spacing: 0.03em;
				text-transform: uppercase;
				color: var(--faint);
				text-align: right;
			}
			.contact .key::after { content: ""; }
			.contact a { font-size: 0.98rem; }

			hr {
				border: 0;
				border-top: 1px solid var(--rule);
				margin: 3.2em 0 0;
			}

			footer {
				margin-top: 2em;
				color: var(--faint);
				font-size: 0.9rem;
			}
			footer a { color: var(--muted); border-bottom-color: transparent; }
			footer a:hover { color: #fff; }
			.mono { font-family: ui-monospace, Menlo, monospace; }

			/* staggered entrance */
			.reveal {
				opacity: 0;
				transform: translateY(14px);
				animation: rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
			}
			@keyframes rise { to { opacity: 1; transform: none; } }
			.d1 { animation-delay: 0.05s; }
			.d2 { animation-delay: 0.16s; }
			.d3 { animation-delay: 0.28s; }
			.d4 { animation-delay: 0.42s; }
			.d5 { animation-delay: 0.56s; }
			.d6 { animation-delay: 0.70s; }

			@media (prefers-reduced-motion: reduce) {
				.reveal { animation: none; opacity: 1; transform: none; }
				.cursor { animation: none; }
			}
		</style>
	</head>
	<body>
		<main class="page">
			<h1 class="reveal d1">Kixel, Corp.<span class="cursor" aria-hidden="true"></span></h1>

			<p class="tagline reveal d2">Making live media suck less.</p>

			<ul class="links reveal d3">
				<li>
					<a href="https://moq.dev" rel="noreferrer">
						<img src="/moq.svg" alt="moq.dev" />
						<span class="tag">open source</span>
					</a>
				</li>
				<li>
					<a href="https://moq.pro" rel="noreferrer">
						<img src="/moq-pro.svg" alt="moq.pro" />
						<span class="tag">the CDN</span>
					</a>
				</li>
			</ul>

			<h2 class="reveal d4">Say hi</h2>
			<ul class="contact reveal d4">
				<li>
					<span class="key">email</span>
					<a href="mailto:me@kixel.us" class="mono">me@kixel.us</a>
				</li>
				<li>
					<span class="key">discord</span>
					<a href="https://discord.moq.dev" rel="noreferrer" class="mono">discord.moq.dev</a>
				</li>
				<li>
					<span class="key">github</span>
					<a href="https://github.com/moq-dev" rel="noreferrer" class="mono">github.com/moq-dev</a>
				</li>
			</ul>

			<hr class="reveal d5" />
			<footer class="reveal d5">
				<img class="avatar" src="/avatar.png" alt="kixelated" />
				<p>© Kixel, Corp.</p>
			</footer>
		</main>
	</body>
</html>
